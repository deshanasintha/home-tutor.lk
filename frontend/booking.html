<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Tuition Request — TutorFinder</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">Tutor<span>Finder</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="search-tutors.html">Find Tutors</a>
      </nav>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <h1>Send a tuition request</h1>
      <p>Confirm the details below and send your request directly to the tutor.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="booking-layout">
        <div class="booking-form-card card">
          <h2>Request details</h2>

          <form id="bookingForm">
            <input type="hidden" id="tutorId" value="SAMPLE_TUTOR_UID_123">

            <div class="form-row">
              <div class="form-group">
                <label for="date" class="form-label">Preferred date</label>
                <input type="date" id="date" name="date" class="form-input" required>
              </div>
              <div class="form-group">
                <label for="time" class="form-label">Preferred time</label>
                <input type="time" id="time" name="time" class="form-input" required>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary btn-block">Send Request</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
